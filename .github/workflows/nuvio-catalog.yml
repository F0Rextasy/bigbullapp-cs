name: nuvio-katalog

concurrency:
  group: nuvio-katalog
  cancel-in-progress: true

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "CHANGELOG.md"
      - "nuvio/providers/**"
      - "nuvio/addon/sources/**"
      - "nuvio/addon/build.mjs"
      - "nuvio/addon-live/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Manifest ve katalog listelerini üret
        run: |
          node nuvio/tools/build-manifest.mjs
          node nuvio/addon/build.mjs
          node nuvio/addon-live/build.mjs
      - name: Değişiklik varsa commit
        run: |
          if [ -n "$(git status --porcelain nuvio/manifest.json nuvio/addon nuvio/addon-live)" ]; then
            git config user.name "F0Rextasy"
            git config user.email "99847357+F0Rextasy@users.noreply.github.com"
            git add nuvio/manifest.json nuvio/addon nuvio/addon-live
            git commit -m "Nuvio katalog listeleri güncellendi"
            BRANCH="${GITHUB_REF_NAME:-master}"
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" \
              || (git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH")
          else
            echo "değişiklik yok"
          fi
