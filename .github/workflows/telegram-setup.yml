name: Telegram Konu Kurulumu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu çek
        uses: actions/checkout@v4

      - name: Python hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Konuları güncelle ve Webhook bağla
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
        run: |
          python3 tools/telegram_topics.py --chat-id "${TELEGRAM_CHAT_ID:--1003994138025}"
          python3 tools/telegram-bot/setup_webhook.py --set "https://bigbull-tg-bot.applio.workers.dev/"
          python3 tools/telegram-bot/setup_webhook.py --info

      - name: Durumu kaydet ve gönder
        run: |
          git config user.name "F0Rextasy"
          git config user.email "99847357+F0Rextasy@users.noreply.github.com"
          git add tools/telegram-topics.json
          git diff --staged --quiet || (git commit -m "Telegram konuları güncellendi" && git push)
