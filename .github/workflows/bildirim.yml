name: Bildirim

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Telegram'a gönder
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "TELEGRAM_BOT_TOKEN veya TELEGRAM_CHAT_ID yok; bildirim atlandı."
            exit 0
          fi
          CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD -- providers \
            | cut -d/ -f2 | sort -u)
          NL=$'\n'
          DETAILS=""
          for M in $CHANGED; do
            if [ ! -f "providers/$M/build.gradle.kts" ]; then
              DETAILS="${DETAILS}• Sağlayıcı kaldırıldı: ${M}${NL}"
              continue
            fi
            V=$(grep -m1 -o 'version[[:space:]]*=[[:space:]]*[0-9]\+' "providers/$M/build.gradle.kts" | grep -o '[0-9]\+' || true)
            E=$(grep -m1 "\\*\\*$M v" CHANGELOG.md || true)
            DETAIL=$(echo "$E" | sed -E 's/^- \*\*[^*]+\*\*: //; s/ Bot \(autopilot\) tarafından üretildi\.//' || true)
            if echo "$E" | grep -q "sıfırdan eklendi"; then
              DETAILS="${DETAILS}• Yeni sağlayıcı eklendi: ${M} (v${V})${NL}"
            else
              DETAILS="${DETAILS}• Sağlayıcı güncellendi: ${M} (v${V})${NL}"
            fi
            [ -n "$DETAIL" ] && DETAILS="${DETAILS}  ${DETAIL}${NL}"
          done
          [ -z "$DETAILS" ] && DETAILS="• Depo güncellemesi yapıldı.${NL}"
          TEXT=$(printf '🚀 BigBullApp güncellemesi%s%s%s📦 BigBullApp' "$NL" "$NL" "$DETAILS")
          curl -sf -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null
