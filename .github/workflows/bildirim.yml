name: Bildirim

on:
  workflow_run:
    workflows: ["Derleme"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Aynı sürüm olsa da gönder"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  telegram:
    # Bildirim yalnızca Derleme BAŞARILI olduktan sonra gider; başarısız derleme sessizdir.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu çek
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Telegram'a gönder
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CUR_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN yok; bildirim atlandı."
            exit 0
          fi
          CHAT="${TELEGRAM_CHAT_ID:-@BigBull_App}"
          THREAD="${TELEGRAM_THREAD_ID:-3}"

          # workflow_run olaylarında github.event.before boştur; önceki başarılı Derleme çalışmasının head_sha değerini bul.
          BEFORE=""
          if [ -n "$GH_TOKEN" ] && [ -n "$REPO" ]; then
            BEFORE=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${REPO}/actions/workflows/build.yml/runs?status=success&per_page=10" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); cur='${CUR_RUN_ID}'; head=sys.argv[1]; runs=[r['head_sha'] for r in d.get('workflow_runs',[]) if str(r.get('id'))!=cur and r.get('head_sha')!=head]; print(runs[0] if runs else '')" "$(git rev-parse HEAD)" 2>/dev/null || true)
          fi

          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" HEAD -- \
              providers nuvio/providers nuvio/manifest.json \
              | cut -d/ -f2 | sort -u)
          else
            CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD -- \
              providers nuvio/providers nuvio/manifest.json \
              | cut -d/ -f2 | sort -u)
          fi
          if [ -z "$CHANGED" ] && [ "$FORCE" != "true" ]; then
            echo "Sağlayıcı değişikliği yok; bildirim atlandı."
            exit 0
          fi

          CUR_VERSION=$(grep -m1 '^## \[' CHANGELOG.md | sed -nE 's/^## \[([^]]+)\].*/\1/p')
          PREV_VERSION=""
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            PREV_VERSION=$(git show "$BEFORE:CHANGELOG.md" 2>/dev/null \
              | grep -m1 '^## \[' | sed -nE 's/^## \[([^]]+)\].*/\1/p' || true)
          else
            PREV=$(git log -1 --format=%H HEAD^ -- providers nuvio/providers nuvio/manifest.json || true)
            if [ -n "$PREV" ]; then
              PREV_VERSION=$(git show "${PREV}:CHANGELOG.md" 2>/dev/null \
                | grep -m1 '^## \[' | sed -nE 's/^## \[([^]]+)\].*/\1/p' || true)
            fi
          fi
          if [ "$FORCE" != "true" ] && [ -n "$CUR_VERSION" ] && [ "$PREV_VERSION" = "$CUR_VERSION" ]; then
            echo "Aynı sürüm için son sağlayıcı commit'i zaten bildirildi; atlandı."
            exit 0
          fi
          NL=$'\n'
          SECTION=$(awk 'BEGIN { s = 0 } /^## \[/ { s++; next } s == 1 { print }' CHANGELOG.md)
          DETAILS=$(printf '%s\n' "$SECTION" | awk '
            /^### / { sub(/^### /, ""); print "— " $0; bullet = 0; next }
            /^- / { sub(/^- /, "• "); print; bullet = 1; next }
            /^[[:space:]]+[^[:space:]]/ && bullet { sub(/^[[:space:]]+/, "  "); print; next }
            { bullet = 0 }
          ' || true)
          [ -n "$DETAILS" ] && DETAILS="${DETAILS}${NL}"
          [ -z "$DETAILS" ] && DETAILS="• Depo güncellemesi yapıldı.${NL}"
          # HTML kaçırma ÖNCE, sonra kendi etiketlerimiz: bölüm başlıkları ve **Ad vX** kalın
          DETAILS=$(printf '%s' "$DETAILS" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          DETAILS=$(printf '%s' "$DETAILS" | sed -E \
            -e "s/^— Eklendi/✨ <b><i>Eklendi<\/i><\/b>/" \
            -e "s/^— Düzeltildi/🛠 <b><i>Düzeltildi<\/i><\/b>/" \
            -e "s/^— Değişti/🔄 <b><i>Değişti<\/i><\/b>/" \
            -e "s/^— Kaldırıldı/🗑 <b><i>Kaldırıldı<\/i><\/b>/" \
            -e "s/^— (.*)$/— <b><i>\1<\/i><\/b>/" \
            -e "s/\*\*([^*]+)\*\*/<b>\1<\/b>/g" \
            -e "s/\`//g")
          HEADING=$(grep -m1 '^## \[' CHANGELOG.md || true)
          VERSION=$(printf '%s' "$HEADING" | sed -nE 's/^## \[([^]]+)\].*/\1/p')
          VERSION_LABEL=""
          [ -n "$VERSION" ] && VERSION_LABEL=" v${VERSION}"
          ANCHOR=$(printf '%s' "$HEADING" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/^##[[:space:]]*//; s/[^a-z0-9 -]//g; s/ +/-/g; s/^-+//; s/-+$//')
          LINK="https://github.com/F0Rextasy/bigbullapp-cs/blob/master/CHANGELOG.md"
          [ -n "$ANCHOR" ] && LINK="${LINK}#${ANCHOR}"
          # Telegram tek mesajda 4096 karakter alır; not kırpılmadan parçalara bölünüp tam gönderilir.
          DETAILS="$DETAILS" VERSION_LABEL="$VERSION_LABEL" LINK="$LINK" \
            TOKEN="$TOKEN" CHAT="$CHAT" THREAD="$THREAD" python3 - <<'PY'
          import os, urllib.parse, urllib.request

          token = os.environ["TOKEN"]; chat = os.environ["CHAT"]; thread = os.environ["THREAD"]
          label = os.environ["VERSION_LABEL"]; link = os.environ["LINK"]
          details = os.environ["DETAILS"].rstrip("\n")
          limit = 3900  # 4096 sınırına HTML varlıkları için pay
          header = f"<b>🚀 BigBullApp güncellemesi{label}</b>\n\n"
          footer = f"\n<a href=\"{link}\">→ Güncelleme notu</a>"

          parts, cur = [], ""
          for line in details.split("\n"):
              while len(line) > limit:
                  if cur:
                      parts.append(cur); cur = ""
                  parts.append(line[:limit]); line = line[limit:]
              cand = f"{cur}\n{line}" if cur else line
              if len(cand) > limit:
                  parts.append(cur); cur = line
              else:
                  cur = cand
          if cur:
              parts.append(cur)
          if not parts:
              parts = ["• Depo güncellemesi yapıldı."]

          messages = [(header if i == 0 else "") + part for i, part in enumerate(parts)]
          if len(messages[-1]) + len(footer) <= 4096:
              messages[-1] += footer
          else:
              messages.append(footer.strip())

          for text in messages:
              data = urllib.parse.urlencode({
                  "chat_id": chat, "message_thread_id": thread, "parse_mode": "HTML",
                  "disable_web_page_preview": "true", "text": text,
              }).encode()
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  resp.read()
          print(f"Telegram: {len(messages)} mesaj gönderildi")
          PY
