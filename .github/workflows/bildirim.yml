name: Bildirim

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Telegram'a gönder
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "TELEGRAM_BOT_TOKEN veya TELEGRAM_CHAT_ID yok; bildirim atlandı."
            exit 0
          fi
          CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD -- providers \
            | cut -d/ -f2 | sort -u)
          NL=$'\n'
          DETAILS=""
          for M in $CHANGED; do
            if [ ! -f "providers/$M/build.gradle.kts" ]; then
              DETAILS="${DETAILS}• ${M} kaldırıldı${NL}"
              continue
            fi
            V=$(grep -m1 -o 'version[[:space:]]*=[[:space:]]*[0-9]\+' "providers/$M/build.gradle.kts" | grep -o '[0-9]\+' || true)
            if git diff-tree --no-commit-id --name-status -r HEAD -- "providers/$M" | grep -q '^A'; then
              DETAILS="${DETAILS}• ${M} eklendi (v${V})${NL}"
            else
              DETAILS="${DETAILS}• ${M} güncellendi (v${V})${NL}"
            fi
          done
          [ -z "$DETAILS" ] && DETAILS="• Depo güncellemesi yapıldı.${NL}"
          DETAILS=$(printf '%s' "$DETAILS" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          HEADING=$(grep -m1 '^## \[' CHANGELOG.md || true)
          ANCHOR=$(printf '%s' "$HEADING" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/^##[[:space:]]*//; s/[^a-z0-9 -]//g; s/ +/-/g; s/^-+//; s/-+$//')
          LINK="https://github.com/F0Rextasy/bigbullapp-cs/blob/master/CHANGELOG.md"
          [ -n "$ANCHOR" ] && LINK="${LINK}#${ANCHOR}"
          TEXT=$(printf '<b>🚀 BigBullApp güncellemesi</b>%s%s%s%s<a href="%s">→ Güncelleme notu</a>' \
            "$NL" "$NL" "$DETAILS" "$NL" "$LINK")
          curl -sf -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null
