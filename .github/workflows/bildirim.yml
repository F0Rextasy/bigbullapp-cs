name: Bildirim

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Telegram'a gönder
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN yok; bildirim atlandı."
            exit 0
          fi
          CHAT=$(python3 -c "import json;print(json.load(open('tools/telegram-topics.json'))['chat_id'])")
          THREAD=$(python3 -c "import json;print(json.load(open('tools/telegram-topics.json'))['topics']['duyuru']['thread_id'])")
          if [ -z "$CHAT" ] || [ -z "$THREAD" ]; then
            echo "tools/telegram-topics.json eksik; bildirim atlandı."
            exit 0
          fi
          CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD -- providers \
            | cut -d/ -f2 | sort -u)
          NL=$'\n'
          DETAILS=""
          if [ -n "$CHANGED" ]; then
            SECTION=$(awk 'BEGIN { s = 0 } /^## \[/ { s++; next } s == 1 { print }' CHANGELOG.md)
            DETAILS=$(printf '%s\n' "$SECTION" | awk '
              /^### / { sub(/^### /, ""); print "— " $0; next }
              /^- / { sub(/^- /, "• "); print }
            ' || true)
            [ -n "$DETAILS" ] && DETAILS="${DETAILS}${NL}"
          DETAILS=$(printf '%s' "$DETAILS" | sed 's/\*\*//g; s/`//g')
          fi
          [ -z "$DETAILS" ] && DETAILS="• Depo güncellemesi yapıldı.${NL}"
          DETAILS=$(printf '%s' "$DETAILS" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          HEADING=$(grep -m1 '^## \[' CHANGELOG.md || true)
          VERSION=$(printf '%s' "$HEADING" | sed -nE 's/^## \[([^]]+)\].*/\1/p')
          VERSION_LABEL=""
          [ -n "$VERSION" ] && VERSION_LABEL=" v${VERSION}"
          ANCHOR=$(printf '%s' "$HEADING" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/^##[[:space:]]*//; s/[^a-z0-9 -]//g; s/ +/-/g; s/^-+//; s/-+$//')
          LINK="https://github.com/F0Rextasy/bigbullapp-cs/blob/master/CHANGELOG.md"
          [ -n "$ANCHOR" ] && LINK="${LINK}#${ANCHOR}"
          TEXT=$(printf '<b>🚀 BigBullApp güncellemesi%s</b>%s%s%s%s<a href="%s">→ Güncelleme notu</a>' \
            "$VERSION_LABEL" "$NL" "$NL" "$DETAILS" "$NL" "$LINK")
          curl -sf -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "message_thread_id=${THREAD}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null
