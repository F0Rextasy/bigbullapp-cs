name: Domain güncellemesi

on:
  schedule:
    - cron: "25 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: domains
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Yalnızca GITHUB_TOKEN: push başka workflow tetiklemez, Build/Bildirim açıkça çağrılır.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python bağımlılıkları
        run: pip install pycryptodome

      - name: Tüm sağlayıcıları yokla
        run: python tools/check.py

      - name: Yüksek güvenli mirror'ları uygula
        run: python tools/revive.py --apply --patch-code --bump-version --release-note

      - name: Yalnızca anlamlı değişiklikleri algıla
        id: diff
        run: |
          python - <<'PY'
          import json, pathlib, subprocess

          def signature(doc):
              return {
                  key: (entry.get("mainUrl"), entry.get("mirrors"))
                  for key, entry in doc["providers"].items()
              }

          old = json.loads(subprocess.check_output(["git", "show", "HEAD:tools/providers.json"]))
          new = json.loads(pathlib.Path("tools/providers.json").read_text(encoding="utf-8"))
          old_sig, new_sig = signature(old), signature(new)
          changed_domains = sorted(key for key in new_sig if old_sig.get(key) != new_sig[key])
          changed_files = subprocess.run(
              ["git", "diff", "--name-only"], capture_output=True, text=True, check=True
          ).stdout.split()
          modules = {
              path.split("/")[1]
              for path in changed_files
              if path.startswith("providers/") and path.endswith(".kt")
          }
          domain_by_module = {
              entry.get("module"): domain for domain, entry in new["providers"].items()
          }
          code_domains = [domain_by_module[m] for m in modules if m in domain_by_module]
          targets = sorted(set(changed_domains) | set(code_domains))
          code_changed = any(path.endswith(".kt") for path in changed_files)
          semantic = bool(targets)

          if semantic:
              print("changed=true", "domains=" + ",".join(targets))
              subprocess.run(["git", "diff", "--stat"], check=False)
          else:
              subprocess.run(["git", "checkout", "--", "tools/providers.json"], check=False)
              print("changed=false")
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"changed={'true' if semantic else 'false'}\n")
              out.write("domains=" + ",".join(targets) + "\n")
          PY

      - name: Fonksiyonel doğrulama
        id: verify
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        env:
          DOMAINS: ${{ steps.diff.outputs.domains }}
        run: |
          if [ -n "$DOMAINS" ]; then
            python tools/verify.py --domain "$DOMAINS"
          else
            echo "Doğrulanacak domain yok."
          fi

      - name: Doğrulama başarısızsa issue aç
        if: steps.diff.outputs.changed == 'true' && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search "Domain güncellemesi doğrulamadan geçemedi in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Açık issue zaten var: #$existing"
            exit 0
          fi
          gh issue create \
            --title "🔄 Domain güncellemesi doğrulamadan geçemedi" \
            --body "Otomatik mirror güncellemesi, fonksiyonel doğrulama başarısız olduğu için geri alındı. Çalıştırma: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Güncellemeyi commit'le ve pushla
        if: steps.diff.outputs.changed == 'true' && steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "F0Rextasy"
          git config user.email "99847357+F0Rextasy@users.noreply.github.com"
          git add -A
          git commit -m "🔄 Domain güncellemesi" -m "Otomatik mirror yenilendi, fonksiyonel doğrulamadan geçti."
          git push origin master
          gh workflow run build.yml --ref master
          gh workflow run bildirim.yml --ref master
