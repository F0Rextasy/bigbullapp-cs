name: Derleme

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/**"
      - "repo.json"
      - "tools/**"
      - "research/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu çek
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: builds dalını çek
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Eski çıktıları temizle
        run: rm -f "$GITHUB_WORKSPACE"/builds/*.cs3

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK paketleri
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          TOOL="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$TOOL" ]; then TOOL="$(command -v sdkmanager)"; fi
          yes | "$TOOL" --licenses >/dev/null 2>&1 || true
          "$TOOL" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Eklentileri derle
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          ./gradlew make makePluginsJson --console=plain
          cp providers/*/build/*.cs3 "$GITHUB_WORKSPACE/builds"
          cp build/plugins.json "$GITHUB_WORKSPACE/builds"

      - name: builds dalını yayınla
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config user.name "F0Rextasy"
          git config user.email "99847357+F0Rextasy@users.noreply.github.com"
          git add .
          # kısayol: manifest değişmediyse push yok; zorlamak için modül sürümünü artır
          if git diff --cached --quiet -- plugins.json; then
            echo "Manifest değişmedi, builds güncellenmedi."
            exit 0
          fi
          git commit --amend -m "Derleme $GITHUB_SHA"
          git push --force origin builds
